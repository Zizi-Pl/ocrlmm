name: Zbuduj Flet APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Konfiguracja Java / Android SDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      # Flutter jest pobierany i zarządzany automatycznie przez CLI Fleta
      # podczas "flet build" - nie przypinamy tu konkretnej wersji Flutter,
      # żeby uniknąć niezgodności z wersją Flet (patrz krok niżej).
      - name: Instalacja Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # WAŻNE: instalujemy Fleta TYLKO raz, z wersji przypiętej w requirements.txt.
      # Nie doinstalowujemy osobno "flet[all]" bez wersji - to nadpisywałoby
      # przypiętą wersję najnowszą dostępną, co prowadzi do niezgodności
      # między wersją użytą do budowania a wersją, z której korzysta main.py.
      - name: Instalacja bibliotek i narzędzia Flet
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Budowanie APK dla Androida
        env:
          CI: "true"
        run: |
          yes | flet build apk --project "ocrLmm" --description "Skaner PZ do EDI" -v

      - name: Zapisanie pliku APK jako Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocrLmm-Android-APK
          path: build/apk/*.apk
