name: Zbuduj Flet APK
on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Pobranie kodu repozytorium
        uses: actions/checkout@v4

      - name: Zwolnienie miejsca na dysku runnera
        run: |
          echo "Miejsce przed czyszczeniem:"
          df -h /
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android/sdk/ndk
          sudo rm -rf /usr/local/lib/android/sdk/emulator
          sudo rm -rf /usr/local/lib/android/sdk/system-images
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache/CodeQL
          sudo rm -rf /opt/hostedtoolcache/go
          sudo rm -rf /opt/hostedtoolcache/PyPy
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/share/powershell
          sudo rm -rf /usr/lib/jvm/temurin-8-jdk-amd64 /usr/lib/jvm/temurin-11-jdk-amd64
          sudo docker image prune --all --force || true
          sudo apt-get clean
          echo "Miejsce po czyszczeniu:"
          df -h /

      - name: Konfiguracja Pythona
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Konfiguracja Java / Android SDK
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      # Flutter jest pobierany i zarządzany automatycznie przez CLI Fleta
      # podczas "flet build" - nie przypinamy tu konkretnej wersji Flutter,
      # żeby uniknąć niezgodności z wersją Flet (patrz krok niżej).
      - name: Instalacja Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      # WAŻNE: instalujemy Fleta TYLKO raz, z wersji przypiętej w requirements.txt.
      # Nie doinstalowujemy osobno "flet[all]" bez wersji - to nadpisywałoby
      # przypiętą wersję najnowszą dostępną, co prowadzi do niezgodności
      # między wersją użytą do budowania a wersją, z której korzysta main.py.
      - name: Instalacja bibliotek i narzędzia Flet
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Budowanie APK dla Androida
        env:
          CI: "true"
        run: |
          yes | flet build apk --project "ocrLmm" --description "Skaner PZ do EDI" -v

      - name: Zapisanie pliku APK jako Artifact
        uses: actions/upload-artifact@v4
        with:
          name: ocrLmm-Android-APK
          path: build/apk/*.apk
