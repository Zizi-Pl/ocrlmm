[project]
name = "ocrlmm"
version = "1.0.0"
description = "Skaner PZ do EDI"
requires-python = ">=3.11"
dependencies = [
    "flet[all]==0.85.3",
    "openai",
]

[tool.flet]
# Domena firmowa w notacji odwróconej + nazwa projektu = identyfikator aplikacji
# (np. com.ocrlmm.ocrlmm). Zmień "ocrlmm" na własną domenę, jeśli publikujesz na Google Play.
org = "com.ocrlmm"
product = "ocrLmm"
company = "ocrLmm"
copyright = "Copyright (C) 2026"

[tool.flet.app]
path = "."

# Uprawnienia wymagane przez aplikację na Androidzie:
# - INTERNET: komunikacja z serwerem LM Studio / API OpenAI
# - CAMERA: robienie zdjęć faktur
# - READ_MEDIA_IMAGES: wybór zdjęć z galerii (Android 13+)
[tool.flet.android.permission]
"android.permission.INTERNET" = true
"android.permission.CAMERA" = true
"android.permission.READ_MEDIA_IMAGES" = true
